name: Build LG Optimus L5 Kernel

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo dpkg --add-architecture i386 || true
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential libncurses-dev libssl-dev bison flex \
          libelf-dev bc git curl cpio python3 python-is-python3 gcc \
          libc6:i386 libstdc++6:i386 zlib1g:i386 || true

    - name: Restore clean case-sensitive Netfilter subsystem
      run: |
        echo "Cloning upstream branch to restore case-sensitive netfilter files corrupted by Windows..."
        git clone --depth 1 -b android-msm-3.4 https://github.com/CyanogenMod/lge-kernel-p700.git /tmp/upstream
        rm -rf include/linux/netfilter include/linux/netfilter_ipv4 include/linux/netfilter_ipv6
        rm -rf net/netfilter net/ipv4/netfilter net/ipv6/netfilter
        cp -r /tmp/upstream/include/linux/netfilter include/linux/
        cp -r /tmp/upstream/include/linux/netfilter_ipv4 include/linux/
        cp -r /tmp/upstream/include/linux/netfilter_ipv6 include/linux/
        cp -r /tmp/upstream/net/netfilter net/
        cp -r /tmp/upstream/net/ipv4/netfilter net/ipv4/
        cp -r /tmp/upstream/net/ipv6/netfilter net/ipv6/
        rm -rf /tmp/upstream

    - name: Download Radxa ARM GCC 4.6 toolchain
      run: |
        git clone --depth 1 https://github.com/radxa/android-platform-prebuilts-gcc-linux-x86-arm-arm-eabi-4.6.git $HOME/toolchain
        # Verify toolchain runs
        $HOME/toolchain/bin/arm-eabi-gcc --version

    - name: Build Kernel zImage
      run: |
        export PATH=$HOME/toolchain/bin:$PATH
        export ARCH=arm
        export CROSS_COMPILE=arm-eabi-

        # Make sure all helper scripts are executable
        chmod -R +x scripts/

        make cyanogenmod_m4_defconfig
        make -j$(nproc) zImage

    - name: Package boot.img images
      run: |
        mkdir -p out
        cp arch/arm/boot/zImage out/zImage

        # Real Android boot image
        if [ -f ramdisk_real_android.img ]; then
          python3 scripts/mkbootimg.py \
            --kernel out/zImage \
            --ramdisk ramdisk_real_android.img \
            --base 0x00200000 \
            --pagesize 2048 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --cmdline "console=tty0 console=ttyMSM0,115200,n8 androidboot.hardware=m4 loglevel=7 lge.signed_image=false" \
            -o out/boot-real-android.img
          echo "Created out/boot-real-android.img"
        fi

        # Diagnostic FB test boot image
        if [ -f ramdisk_fbtest.img ]; then
          python3 scripts/mkbootimg.py \
            --kernel out/zImage \
            --ramdisk ramdisk_fbtest.img \
            --base 0x00200000 \
            --pagesize 2048 \
            --kernel_offset 0x00008000 \
            --ramdisk_offset 0x01000000 \
            --tags_offset 0x00000100 \
            --cmdline "console=tty0 console=ttyMSM0,115200,n8 androidboot.hardware=m4 debug ignore_loglevel loglevel=8 log_buf_len=1M lge.signed_image=false" \
            -o out/boot-fbtest.img
          echo "Created out/boot-fbtest.img"
        fi

    - name: Upload Kernel and boot.img artifacts
      uses: actions/upload-artifact@v4
      with:
        name: e610-kernel-artifacts
        path: out/
